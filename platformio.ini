; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:nano_r4]
; 動作を確かめた版に固定する（フレームワークとコンパイラも。新しい版は試していない）
platform = platformio/renesas-ra@1.8.0
platform_packages =
    platformio/framework-arduinorenesas-uno@1.5.1
    platformio/toolchain-gccarmnoneeabi@1.70201.0
board = nano_r4
framework = arduino

; Servo.h を使えるようにする
lib_deps =
    arduino-libraries/Servo@1.3.0
; Arduino IDE が Nano R4 で定義するマクロ（PlatformIO のボード定義には無い）
build_flags =
    -D ARDUINO_NANO_R4
