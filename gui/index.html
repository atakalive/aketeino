<!DOCTYPE html>
<!--
  aketeino 3ch サーボシャッター 動作確認用 GUI (Web Serial API)

  使い方:
    - Chrome / Edge など Chromium 系ブラウザで開く(Web Serial 対応必須)。
    - まず file:// で直接開いて試す。動かない場合はプロジェクトルートで
        python -m http.server
      を起動し http://localhost:8000/gui/ で開く。
    - 他のシリアルモニタ(pio device monitor 等)を閉じてから Connect。

  対応ファーム: src/main.cpp の文法 <cmd>[ch1-3][ <angle>]
    o/c=開/閉, O/C=開閉角度を設定して移動, a/A=任意角度へ移動, q=現在角度照会
    角度は必ずスペース区切り。応答は裸の数値 / "ERR: ..." / "UNKNOWN CMD: ..."。
    応答にch識別子は無いため、送信ch を FIFO で応答行に対応付ける。
-->
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>aketeino 3ch サーボシャッター 動作確認</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, "Segoe UI", sans-serif;
      margin: 0; padding: 1rem; max-width: 760px;
      margin-inline: auto;
    }
    header {
      display: flex; align-items: center; gap: .75rem; flex-wrap: wrap;
      margin-bottom: 1rem;
    }
    h1 { font-size: 1.1rem; margin: 0; flex: 1 1 auto; }
    button {
      font: inherit; padding: .45rem .8rem; border-radius: .4rem;
      border: 1px solid #888; background: #f3f3f3; cursor: pointer;
    }
    button:hover:not(:disabled) { background: #e6e6e6; }
    button:disabled { opacity: .45; cursor: not-allowed; }
    @media (prefers-color-scheme: dark) {
      button { background: #2a2a2a; color: #eee; border-color: #555; }
      button:hover:not(:disabled) { background: #383838; }
      .card, .log { border-color: #444; }
    }
    #status { font-weight: bold; }
    #status.on  { color: #1a8f3c; }
    #status.off { color: #b00; }
    .warn {
      background: #ffecec; border: 1px solid #f0a0a0; color: #800;
      padding: .6rem .8rem; border-radius: .4rem; margin-bottom: 1rem;
    }
    .channels { display: grid; gap: .75rem; grid-template-columns: 1fr; }
    @media (min-width: 560px) { .channels { grid-template-columns: repeat(3, 1fr); } }
    .card {
      border: 1px solid #ccc; border-radius: .6rem; padding: .7rem;
      display: flex; flex-direction: column; gap: .5rem;
    }
    .card h2 { font-size: 1rem; margin: 0; display: flex; justify-content: space-between; align-items: baseline; }
    .angle-now { font-variant-numeric: tabular-nums; font-weight: bold; }
    .row { display: flex; gap: .4rem; flex-wrap: wrap; }
    .row button { flex: 1 1 auto; }
    .angle-input { width: 4.5rem; font: inherit; padding: .4rem; text-align: right; }
    .small { font-size: .82rem; padding: .35rem .5rem; }
    .log {
      margin-top: 1rem; border: 1px solid #ccc; border-radius: .5rem;
      height: 13rem; overflow-y: auto; padding: .5rem;
      font-family: ui-monospace, Consolas, monospace; font-size: .82rem;
      white-space: pre-wrap; word-break: break-all;
    }
    .log .tx { color: #0a6; }
    .log .rx { color: #06c; }
    .log .er { color: #c00; }
    .log .sys { opacity: .6; }
    .logbar { display: flex; justify-content: space-between; align-items: center; margin-top: .75rem; }
    .hint { font-size: .8rem; opacity: .7; margin-top: .5rem; }
  </style>
</head>
<body>
  <header>
    <h1>aketeino 3ch サーボシャッター</h1>
    <span id="status" class="off">未接続</span>
    <button id="connectBtn">Connect</button>
    <button id="disconnectBtn" disabled>Disconnect</button>
  </header>

  <div id="unsupported" class="warn" hidden>
    このブラウザは Web Serial API に対応していません。Chrome または Edge で開いてください。
  </div>

  <main id="panel">
    <div class="channels" id="channels"></div>

    <div class="logbar">
      <strong>ログ</strong>
      <button id="clearBtn" class="small">Clear</button>
    </div>
    <div class="log" id="log" aria-live="polite"></div>

    <p class="hint">
      角度は 0–180。COM ポートは1プロセス占有のため、他のシリアルモニタを閉じてから Connect。
      Connect 時にボードがリセットされ READY バナーが出ることがあります。
    </p>
  </main>

  <script>
  "use strict";

  const NUM_CH = 3;

  // ---- DOM refs ----
  const $ = (id) => document.getElementById(id);
  const statusEl = $("status");
  const connectBtn = $("connectBtn");
  const disconnectBtn = $("disconnectBtn");
  const clearBtn = $("clearBtn");
  const logEl = $("log");
  const channelsEl = $("channels");
  const angleNowEls = [];
  const angleInputEls = [];

  // ---- Serial state ----
  let port = null;
  let writer = null;
  let reader = null;
  let readLoopDone = null;
  const encoder = new TextEncoder();
  // 送信chを FIFO で応答行に対応付ける(応答にch識別子が無いため)
  const pending = [];

  // ---- logging ----
  function pad(n) { return String(n).padStart(2, "0"); }
  function stamp() {
    const d = new Date();
    return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  }
  function log(text, cls) {
    const line = document.createElement("div");
    if (cls) line.className = cls;
    line.textContent = `[${stamp()}] ${text}`;
    logEl.appendChild(line);
    logEl.scrollTop = logEl.scrollHeight;
  }

  // ---- UI build ----
  function buildChannels() {
    for (let i = 0; i < NUM_CH; i++) {
      const ch = i + 1;
      const card = document.createElement("div");
      card.className = "card";

      const h2 = document.createElement("h2");
      const title = document.createElement("span");
      title.textContent = `CH${ch}`;
      const now = document.createElement("span");
      now.className = "angle-now";
      now.textContent = "--°";
      angleNowEls[i] = now;
      h2.append(title, now);

      const row1 = document.createElement("div");
      row1.className = "row";
      row1.append(
        mkBtn("開 (o)", () => send(`o${ch}`, i)),
        mkBtn("閉 (c)", () => send(`c${ch}`, i)),
        mkBtn("照会 (q)", () => send(`q${ch}`, i)),
      );

      const row2 = document.createElement("div");
      row2.className = "row";
      const input = document.createElement("input");
      input.type = "number"; input.min = "0"; input.max = "180"; input.value = "90";
      input.className = "angle-input"; input.setAttribute("aria-label", `CH${ch} 角度`);
      angleInputEls[i] = input;
      row2.append(input, mkBtn("移動 (A)", () => sendAngle("A", ch, i)));

      const row3 = document.createElement("div");
      row3.className = "row";
      row3.append(
        mkBtn("開に設定&移動 (O)", () => sendAngle("O", ch, i), "small"),
        mkBtn("閉に設定&移動 (C)", () => sendAngle("C", ch, i), "small"),
      );

      card.append(h2, row1, row2, row3);
      channelsEl.appendChild(card);
    }
  }
  function mkBtn(label, onClick, extra) {
    const b = document.createElement("button");
    b.textContent = label;
    if (extra) b.className = extra;
    b.disabled = true;
    b.addEventListener("click", onClick);
    return b;
  }

  function setControlsEnabled(on) {
    channelsEl.querySelectorAll("button").forEach((b) => { b.disabled = !on; });
    angleInputEls.forEach((el) => { el.disabled = !on; });
  }

  // ---- send ----
  function clampAngle(raw) {
    let v = parseInt(raw, 10);
    if (Number.isNaN(v)) return null;
    if (v < 0) v = 0;
    if (v > 180) v = 180;
    return v;
  }

  async function sendAngle(cmd, ch, idx) {
    const v = clampAngle(angleInputEls[idx].value);
    if (v === null) {
      log(`角度が未入力/不正です (CH${ch})`, "er");
      return;
    }
    angleInputEls[idx].value = String(v); // クランプ結果を反映
    await send(`${cmd}${ch} ${v}`, idx);
  }

  async function send(cmd, chIdx) {
    if (!writer) return;
    try {
      pending.push(chIdx);
      await writer.write(encoder.encode(cmd + "\n"));
      log("-> " + cmd, "tx");
    } catch (e) {
      pending.pop();
      log("送信失敗: " + e.message, "er");
    }
  }

  // ---- receive (行バッファ: チャンクまたぎ対応) ----
  function handleLine(raw) {
    const line = raw.replace(/\r$/, "").trim();
    if (line === "") return;
    const isNumeric = /^-?\d+$/.test(line);
    const isErr = line.startsWith("ERR:") || line.startsWith("UNKNOWN");

    if (isNumeric) {
      log("<- " + line, "rx");
      const idx = pending.shift();           // FIFO でこの応答のchを特定
      if (idx !== undefined && idx >= 0) {
        angleNowEls[idx].textContent = `${parseInt(line, 10)}°`;
      }
    } else if (isErr) {
      log("<- " + line, "er");
      pending.shift();                        // 数値は来ないが応答1行を消費
    } else {
      // 起動バナー等の非応答行。pending は消費しない
      log("<- " + line, "sys");
    }
  }

  async function readLoop() {
    const decoder = new TextDecoder();
    let buf = "";
    try {
      while (port && port.readable) {
        reader = port.readable.getReader();
        try {
          while (true) {
            const { value, done } = await reader.read();
            if (done) break;
            buf += decoder.decode(value, { stream: true });
            let nl;
            while ((nl = buf.indexOf("\n")) >= 0) {
              handleLine(buf.slice(0, nl));
              buf = buf.slice(nl + 1);
            }
          }
        } finally {
          reader.releaseLock();
          reader = null;
        }
      }
    } catch (e) {
      // 切断・抜けで read が例外を投げる(正常系)
      log("受信終了: " + e.message, "sys");
    }
  }

  // ---- connect / disconnect ----
  async function connect() {
    try {
      port = await navigator.serial.requestPort();      // 要ユーザー操作
      await port.open({ baudRate: 115200 });
      writer = port.writable.getWriter();
      pending.length = 0;
      readLoopDone = readLoop();
      statusEl.textContent = "接続中"; statusEl.className = "on";
      connectBtn.disabled = true;
      disconnectBtn.disabled = false;
      setControlsEnabled(true);
      log("接続しました", "sys");
    } catch (e) {
      log("接続失敗: " + e.message, "er");
      await cleanup();
    }
  }

  async function disconnect() {
    log("切断します", "sys");
    await cleanup();
  }

  async function cleanup() {
    try { if (reader) await reader.cancel(); } catch (_) {}
    try { if (writer) { writer.releaseLock(); } } catch (_) {}
    writer = null;
    try { if (readLoopDone) await readLoopDone; } catch (_) {}
    readLoopDone = null;
    try { if (port) await port.close(); } catch (_) {}
    port = null;
    pending.length = 0;
    statusEl.textContent = "未接続"; statusEl.className = "off";
    connectBtn.disabled = false;
    disconnectBtn.disabled = true;
    setControlsEnabled(false);
  }

  // ---- init ----
  function init() {
    buildChannels();
    if (!("serial" in navigator)) {
      $("unsupported").hidden = false;
      connectBtn.disabled = true;
      return;
    }
    connectBtn.addEventListener("click", connect);
    disconnectBtn.addEventListener("click", disconnect);
    clearBtn.addEventListener("click", () => { logEl.textContent = ""; });
    // ケーブル抜け検知
    navigator.serial.addEventListener("disconnect", (e) => {
      if (port && e.target === port) {
        log("ポートが切断されました(ケーブル抜け?)", "er");
        cleanup();
      }
    });
  }

  init();
  </script>
</body>
</html>
